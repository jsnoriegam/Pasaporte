name: AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AppImage
        run: CONTAINER_ENGINE=docker ./packaging/build-in-podman.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pasaporte-AppImage
          path: dist/*.AppImage

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage

name: AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libnss3 \
            libnspr4 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

  appimage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: .build-cache/pip
          key: appimage-${{ runner.os }}-${{ hashFiles('requirements.txt', 'packaging/Containerfile') }}
          restore-keys: |
            appimage-${{ runner.os }}-

      - name: Build AppImage
        run: CONTAINER_ENGINE=docker ./packaging/build-in-podman.sh

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libnss3 \
            libnspr4 \
            libdbus-1-3 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libfreetype6 \
            libgbm1 \
            libstdc++6

      - name: Smoke test
        run: APPIMAGE_EXTRACT_AND_RUN=1 dist/Pasaporte-*-x86_64.AppImage --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pasaporte-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          generate_release_notes: true
